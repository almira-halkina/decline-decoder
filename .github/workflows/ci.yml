name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend, tests and evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # publishes exact tags only
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --project backend --frozen
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check . ../scripts ../evals
          uv run ruff format --check . ../scripts ../evals
      - name: Type-check
        working-directory: backend
        run: uv run mypy app tests ../scripts ../evals
      - name: Unit tests
        working-directory: backend
        run: uv run pytest -q
      # Rules engine only: deterministic, no API keys, no network. Fails below evals/thresholds.json.
      - name: Evals
        run: uv run --project backend python evals/run_evals.py --check --out "$RUNNER_TEMP/results.md"
      - name: Eval report
        if: always()
        run: cat "$RUNNER_TEMP/results.md" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
